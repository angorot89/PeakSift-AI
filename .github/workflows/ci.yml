name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        # Next generates the route types (LayoutProps, PageProps) first; then plain tsc.
        run: |
          npx next typegen
          npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend (ruff, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peaksift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values for the CI database service; not real credentials.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/peaksift_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/peaksift_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real-0123456789
      # The video pipeline tests generate tiny fixtures with ffmpeg and probe them with
      # ffprobe; in CI a missing binary must fail the tests, not skip them.
      REQUIRE_FFMPEG: "1"
      # Short-form editing burns in captions with libass; the caption tests must run (and
      # fail if libass or a font is missing), never skip.
      REQUIRE_LIBASS: "1"
      # Background jobs: Redis service above; the live-broker test must not skip.
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS: "1"
      # Provider tests mock inference. Refuse any accidental Hugging Face download.
      HF_HUB_OFFLINE: "1"
      # No OpenAI key in CI, ever; the OpenAI provider tests use a fake SDK client.
      # Clip detection: no Ollama in CI. Point the endpoint at a closed port with a short
      # connect timeout so an accidental real inference call fails fast instead of hanging;
      # the provider tests use a mocked transport or an in-process fake server.
      OLLAMA_BASE_URL: http://127.0.0.1:9
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: No model weights or media are tracked
        # Detector weights are fetched by an operator script (pinned sha256), never committed;
        # test media is generated at test time.
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.onnx' '*.tflite' '*.pt' '*.pth' '*.bin' '*.safetensors' 'backend/models/*' 'media/*' '*.mp4' '*.mov' '*.wav')"
          [ -z "$tracked" ] || { echo "model weights or media committed:"; echo "$tracked"; exit 1; }
          echo "no weights or media in the repository"
      - name: Install FFmpeg and caption fonts
        # ffprobe for metadata, ffmpeg for rendering and generated fixtures; Noto Sans (OFL,
        # installed from the distribution, never committed) is the caption font, with Noto
        # Sans Arabic and the rest of fonts-noto-core as fontconfig fallbacks.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig fonts-noto-core
          ffprobe -version | head -1
      - name: FFmpeg provides the encoders and filters rendering uses
        # Clips and shorts are rendered with libx264 + aac, and shorts use the filters below
        # (subtitles = libass for captions). CI must exercise the same render path as
        # production and development, not discover on release day that it cannot.
        run: |
          set -euo pipefail
          encoders="$(ffmpeg -hide_banner -encoders)"
          grep -qE '^ V\S* libx264 ' <<<"$encoders" || { echo "libx264 encoder missing"; exit 1; }
          grep -qE '^ A\S* aac ' <<<"$encoders" || { echo "aac encoder missing"; exit 1; }
          filters="$(ffmpeg -hide_banner -filters)"
          for name in subtitles scale crop pad overlay gblur split setsar color; do
            grep -qE "^ \S+ $name " <<<"$filters" || { echo "ffmpeg filter missing: $name"; exit 1; }
          done
          ffmpeg -hide_banner -version | grep -q -- '--enable-libass' || { echo "ffmpeg built without libass"; exit 1; }
          echo "libx264, aac, libass (subtitles) and layout filters available"
      - name: Caption fonts resolve through fontconfig
        run: |
          set -euo pipefail
          family="$(fc-match -f '%{family[0]}' 'Noto Sans')"
          [ "$family" = "Noto Sans" ] || { echo "Noto Sans not installed (got: $family)"; exit 1; }
          fc-list ':lang=ar' family | grep -q 'Noto Sans Arabic' || { echo "no Arabic fallback font"; exit 1; }
          echo "Noto Sans + Noto Sans Arabic available"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply cleanly, match the models and survive a full cycle
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
      - name: libass really draws caption text (burned-in probe frame)
        run: >-
          python -c "from app.services.clip_edit.composition import require_caption_rendering;
          require_caption_rendering('ffmpeg', 'Noto Sans'); print('caption probe: text drawn')"
      - name: Smart reframe renders the deepest allowed crop path on this FFmpeg
        # The moving crop is an FFmpeg expression tree; expression limits differ by build.
        run: python scripts/smart_crop_probe.py
      - run: pytest -rs  # -rs lists any skipped tests so a skipped media test is visible
      - name: Real broker + worker smoke (ping round-trip + task registration, no inference)
        run: python scripts/celery_smoke.py
