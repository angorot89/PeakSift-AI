# PeakSift reverse proxy: one HTTPS origin.
#   /api/…  → the API (prefix removed), streaming uploads and Range responses unbuffered
#   /…      → the Next.js frontend
# TLS is required in production (Secure cookies, OAuth redirect): certificates are mounted
# at /etc/nginx/certs (tls.crt, tls.key). Port 80 only redirects to HTTPS.

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Access lines without query strings: OAuth codes and states never reach the logs.
  log_format peaksift '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time $request_id';
  access_log /dev/stdout peaksift;
  error_log /dev/stderr warn;

  upstream api { server api:8000; keepalive 16; }
  upstream frontend { server frontend:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    listen [::]:80;
    server_name _;
    # The container's own healthcheck (plain HTTP, never forwarded).
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;

    # HTTPS only from now on (the frontend and API add their own CSP and framing rules).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Largest source video (MAX_VIDEO_UPLOAD_BYTES, default 2 GiB) plus multipart framing.
    client_max_body_size 2100m;

    location /api/ {
      proxy_pass http://api/;
      proxy_hide_header Strict-Transport-Security;  # one HSTS header: the proxy's
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      # Stream uploads to the API and media back to the browser without temp files.
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
