[project]
name = "peaksift-backend"
version = "0.1.0"
description = "PeakSift AI API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",  # enables pydantic's EmailStr
    "python-multipart>=0.0.20,<1",  # multipart/form-data parsing for uploads
    "celery>=5.4,<6",  # background jobs (transcription)
    "redis>=5,<9",  # Celery broker client
    "faster-whisper>=1.1,<2",  # local speech-to-text (CTranslate2 Whisper)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1",  # required by FastAPI's TestClient
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient prefers its own `httpx2` fork, but FastAPI's documented
    # testing stack is official `httpx`. Silence the resulting deprecation notice.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.isort]
# The local `alembic/` migrations directory shadows the package name.
known-third-party = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
