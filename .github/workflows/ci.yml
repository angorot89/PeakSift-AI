name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests (status sync, captions, audio mix, publishing, security headers, visual assets and elements, Auto Edit display, editor hydration, visual search)
        run: npm test
      - name: Type check
        # Next generates the route types (LayoutProps, PageProps) first; then plain tsc.
        run: |
          npx next typegen
          npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend (ruff, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # PostgreSQL 16 with pgvector (the semantic index stores vectors), official image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peaksift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values for the CI database service; not real credentials.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/peaksift_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/peaksift_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real-0123456789
      # The video pipeline tests generate tiny fixtures with ffmpeg and probe them with
      # ffprobe; in CI a missing binary must fail the tests, not skip them.
      REQUIRE_FFMPEG: "1"
      # Short-form editing burns in captions with libass; the caption tests must run (and
      # fail if libass or a font is missing), never skip.
      REQUIRE_LIBASS: "1"
      # Background jobs: Redis service above; the live-broker test must not skip.
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS: "1"
      # Provider tests mock inference. Refuse any accidental Hugging Face download.
      HF_HUB_OFFLINE: "1"
      # No OpenAI key in CI, ever; the OpenAI provider tests use a fake SDK client.
      # Clip detection: no Ollama in CI. Point the endpoint at a closed port with a short
      # connect timeout so an accidental real inference call fails fast instead of hanging;
      # the provider tests use a mocked transport or an in-process fake server.
      OLLAMA_BASE_URL: http://127.0.0.1:9
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "1"
      # Semantic visual search: the deterministic fake embedding provider. CI never downloads
      # the CLIP model (scripts/fetch_semantic_model.py is an operator step); the real model
      # has opt-in tests (pytest -m real_model with PEAKSIFT_REAL_SEMANTIC_MODEL_DIR).
      SEMANTIC_PROVIDER: "fake"
      # Performance analytics: the deterministic fake metrics provider. CI never calls Google.
      PERFORMANCE_PROVIDER: "fake"
    steps:
      - uses: actions/checkout@v4
      - name: No model weights or media are tracked
        # Detector weights are fetched by an operator script (pinned sha256), never committed;
        # test media is generated at test time.
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.onnx' '*.tflite' '*.pt' '*.pth' '*.bin' '*.safetensors' 'backend/models/*' 'media/*' '*.mp4' '*.mov' '*.webm' '*.wav' '*.mp3' '*.m4a' '*.aac' '*.ogg' '*.opus' '*.flac' '*.aiff' '*.jpg' '*.jpeg' '*.webp' 'backend/**/*.png' 'frontend/public/**/*.png')"
          [ -z "$tracked" ] || { echo "model weights or media committed:"; echo "$tracked"; exit 1; }
          echo "no weights or media in the repository"
      - name: Install FFmpeg and caption fonts
        # ffprobe for metadata, ffmpeg for rendering and generated fixtures; Noto Sans (OFL,
        # installed from the distribution, never committed) is the caption font, with Noto
        # Sans Arabic and the rest of fonts-noto-core as fontconfig fallbacks; Symbola is the
        # monochrome emoji font dynamic captions use (libass cannot draw colour emoji).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-symbola
          ffprobe -version | head -1
      - name: FFmpeg provides the encoders and filters rendering uses
        # Clips and shorts are rendered with libx264 + aac, and shorts use the filters below
        # (subtitles = libass for captions). CI must exercise the same render path as
        # production and development, not discover on release day that it cannot.
        run: |
          set -euo pipefail
          encoders="$(ffmpeg -hide_banner -encoders)"
          grep -qE '^ V\S* libx264 ' <<<"$encoders" || { echo "libx264 encoder missing"; exit 1; }
          grep -qE '^ A\S* aac ' <<<"$encoders" || { echo "aac encoder missing"; exit 1; }
          filters="$(ffmpeg -hide_banner -filters)"
          for name in subtitles scale crop pad overlay gblur split setsar color; do
            grep -qE "^ \S+ $name " <<<"$filters" || { echo "ffmpeg filter missing: $name"; exit 1; }
          done
          ffmpeg -hide_banner -version | grep -q -- '--enable-libass' || { echo "ffmpeg built without libass"; exit 1; }
          echo "libx264, aac, libass (subtitles) and layout filters available"
      - name: Caption fonts resolve through fontconfig
        run: |
          set -euo pipefail
          family="$(fc-match -f '%{family[0]}' 'Noto Sans')"
          [ "$family" = "Noto Sans" ] || { echo "Noto Sans not installed (got: $family)"; exit 1; }
          fc-list ':lang=ar' family | grep -q 'Noto Sans Arabic' || { echo "no Arabic fallback font"; exit 1; }
          fc-list ':charset=1f600' family | grep -q 'Symbola' || { echo "no monochrome emoji font"; exit 1; }
          echo "Noto Sans + Noto Sans Arabic + Symbola (monochrome emoji) available"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply cleanly, match the models and survive a full cycle
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
      - name: libass really draws caption text (burned-in probe frame)
        run: >-
          python -c "from app.services.clip_edit.composition import require_caption_rendering;
          require_caption_rendering('ffmpeg', 'Noto Sans'); print('caption probe: text drawn')"
      - name: Caption font families draw through libass (Latin, Arabic, emoji)
        # Each family the app expects must resolve by name and draw real glyphs (not
        # missing-glyph boxes): Noto Sans, Noto Sans Arabic, and a monochrome emoji font.
        run: python scripts/caption_font_probe.py
      - name: Dynamic captions render end to end (word sync, hook, safe area)
        # Known words ONE / TWO / THREE + a hook through the real compose_short: checks the
        # MP4 (1080x1920, H.264, AAC, duration) and frames (active word moves, hook shown then
        # gone, text inside the safe area).
        run: python scripts/dynamic_caption_probe.py
      - name: Audio mix matrix, ducking and loudness on this FFmpeg
        # Deterministic test tones through the real mixer: 8 source/music/effect combinations
        # at exact length, measured ducking dip and recovery, -14 LUFS / true peak, and a full
        # mix composed into a short with AAC stereo 48 kHz audio.
        run: python scripts/audio_mix_probe.py
      - name: Smart reframe renders the deepest allowed crop path on this FFmpeg
        # The moving crop is an FFmpeg expression tree; expression limits differ by build.
        run: python scripts/smart_crop_probe.py
      - name: B-roll, picture-in-picture, overlays and fades render on this FFmpeg (V1.1 matrix)
        # Generated fixtures (16:9 base clip, landscape/portrait images, transparent PNG,
        # landscape/portrait B-roll videos) rendered into 1080 x 1920 shorts: image and video
        # cutaways (fill/fit, offset), picture-in-picture, transparent overlay, fade, several
        # elements in sequence, captions and the hook on top; pixels, duration, frame rate, codecs.
        run: python scripts/visual_render_probe.py
      - name: Auto Edit quality benchmark (deterministic rules, no model)
        # Six representative clips x four recipes, planned by the rules and validated by the
        # server: fails on any invalid configuration. Descriptive QA, no score. The same check
        # runs against a local model with --planner ollama (never in CI).
        run: python scripts/auto_edit_benchmark.py
      - name: Semantic match benchmark (deterministic fake provider, no weights)
        # Safety gates: no false strong match, every negative query quiet, every positive
        # query's first result relevant. The real-model run is local acceptance (--model-dir).
        run: python scripts/semantic_benchmark.py --calibrate
      - uses: docker/setup-buildx-action@v3
      - name: Build MinIO from source (MinIO publishes no community images; layers cached)
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/minio.Dockerfile
          tags: peaksift-minio:ci
          load: true
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max
      - name: Start a live S3-compatible service for the storage suites
        working-directory: .
        run: |
          set -euo pipefail
          user="ci$(python3 -c 'import secrets; print(secrets.token_hex(6))')"
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER="$user" \
            -e MINIO_ROOT_PASSWORD="$password" peaksift-minio:ci server /data
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/live
          {
            echo "TEST_S3_ENDPOINT_URL=http://127.0.0.1:9000"
            echo "TEST_S3_ACCESS_KEY_ID=$user"
            echo "TEST_S3_SECRET_ACCESS_KEY=$password"
          } >> "$GITHUB_ENV"
      - name: Tests (live S3 storage suites required, never skipped)
        env:
          REQUIRE_LIVE_S3: "1"
        run: pytest -rs  # -rs lists any skipped tests so a skipped media test is visible
      - name: V1.1 visual enrichment suites (live S3 required, listed separately for visibility)
        # Visual assets, B-roll suggestions, edit configuration, rendering, frame-level quality,
        # hardening and the CI matrix (Smart Reframe, captions, hook, audio, full V1 edit, MinIO).
        env:
          REQUIRE_LIVE_S3: "1"
        run: >-
          pytest -rs -q tests/test_visual_asset_model.py tests/test_visual_assets_api.py
          tests/test_visual_details.py tests/test_visual_hardening.py tests/test_visuals_config.py
          tests/test_visual_edit_api.py tests/test_visual_transitions.py tests/test_visual_render.py
          tests/test_visual_layout.py tests/test_broll_render_quality.py tests/test_visual_ci_matrix.py
          tests/test_broll_model.py tests/test_broll_validation.py tests/test_broll_providers.py
          tests/test_broll_pipeline.py tests/test_broll_api.py tests/test_broll_matching.py
      - name: V1.2 Auto Edit suites (live S3 required, listed separately for visibility)
        # Domain, recipes, planner contract, local planner (mocked HTTP), fallback rules, server
        # validation, pipeline, API, hardening, quality benchmark and the CI matrix (plans
        # rendered through the real renderer, and plan/apply/render on MinIO). No model runs.
        env:
          REQUIRE_LIVE_S3: "1"
        run: >-
          pytest -rs -q tests/test_auto_edit_model.py tests/test_auto_edit_fingerprint.py
          tests/test_auto_edit_state.py tests/test_auto_edit_recipes.py
          tests/test_auto_edit_contract.py tests/test_auto_edit_ollama.py
          tests/test_auto_edit_fallback.py tests/test_auto_edit_validation.py
          tests/test_auto_edit_pipeline.py tests/test_auto_edit_api.py
          tests/test_auto_edit_hardening.py tests/test_auto_edit_benchmark.py
          tests/test_auto_edit_ci_matrix.py
      - name: V1.3 semantic asset suites (live S3 required, listed separately for visibility)
        # pgvector domain and migrations, the embedding contract and CLIP provider (fake ONNX
        # sessions), image and video indexing, the pipeline and operator command, hybrid search,
        # B-roll matching, Auto Edit with semantic matches, index management, performance,
        # hardening, the benchmark and the CI matrix (index/search/match on MinIO).
        env:
          REQUIRE_LIVE_S3: "1"
        run: >-
          pytest -rs -q tests/test_semantic_domain.py tests/test_semantic_provider.py
          tests/test_semantic_indexing.py tests/test_semantic_video.py
          tests/test_semantic_lifecycle.py tests/test_semantic_search.py
          tests/test_semantic_broll_matching.py tests/test_auto_edit_semantic.py
          tests/test_semantic_management.py tests/test_semantic_performance.py
          tests/test_semantic_hardening.py tests/test_semantic_benchmark.py
          tests/test_semantic_ci_matrix.py
      - name: Real broker + worker smoke (ping round-trip + task registration, no inference)
        run: python scripts/celery_smoke.py

  containers:
    name: Production containers (build, start, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings for a throwaway stack (random secrets, generated here, never stored)
        run: |
          # The MinIO secrets always start with "-" here: random secrets may, and minio-init
          # must never read one as a command-line flag (a regression seen in CI).
          rand() { python3 -c "import secrets; print(secrets.token_urlsafe(32))"; }
          umask 077
          cat > deploy/.env <<ENV
          PUBLIC_URL=https://localhost
          PUBLIC_HOST=localhost
          SECRET_KEY=$(rand)
          POSTGRES_PASSWORD=$(rand)
          REDIS_PASSWORD=$(rand)
          MINIO_ROOT_USER=root$(python3 -c "import secrets; print(secrets.token_hex(6))")
          MINIO_ROOT_PASSWORD=-$(rand)
          S3_APP_ACCESS_KEY=app$(python3 -c "import secrets; print(secrets.token_hex(6))")
          S3_APP_SECRET_KEY=-$(rand)
          FASTER_WHISPER_MODEL=tiny
          ENV
          sed -i 's/^ *//' deploy/.env
          deploy/scripts/dev-certs.sh localhost
      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build --wait --wait-timeout 900
      - name: Smoke test through the HTTPS proxy
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env exec -T worker \
            sh -c 'ffmpeg -v error -y -f lavfi -i testsrc=d=2:s=160x90:r=25 -f lavfi -i sine=d=2 \
                   -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart \
                   /work/smoke.mp4 && cat /work/smoke.mp4' > smoke.mp4
          python3 deploy/scripts/smoke.py https://localhost smoke.mp4
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env exec -T api \
            python -c "from app.core.config import get_settings as s; assert s().storage_backend == 's3'"
      - name: Backup, verify and disposable restore inside the stack (PostgreSQL 16, MinIO)
        run: |
          set -euo pipefail
          compose() { docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env "$@"; }
          compose exec -T api pg_dump --version
          compose exec -T api python -m app.cli.backup create /work/backup-ci --copy-media
          compose exec -T api python -m app.cli.backup verify /work/backup-ci
          compose exec -T api python -m app.cli.backup restore-test /work/backup-ci
          compose exec -T api sh -c 'test "$(ls /work/backup-ci/media/videos | wc -l)" -ge 1'
      - name: Containers run as unprivileged users; the worker is healthy and answers
        run: |
          set -euo pipefail
          compose() { docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env "$@"; }
          for service in api worker frontend; do
            uid="$(compose exec -T "$service" id -u)"
            echo "$service runs as uid $uid"
            test "$uid" != "0"
          done
          compose exec -T worker python -m app.cli.health --ping
      - name: No secret (or any 10-character piece of one) appears in any container log
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --no-color > stack.log
          python3 - <<'PY'
          import pathlib, sys
          log = pathlib.Path("stack.log").read_text(errors="replace")
          names = {"SECRET_KEY", "POSTGRES_PASSWORD", "REDIS_PASSWORD", "MINIO_ROOT_PASSWORD", "S3_APP_SECRET_KEY"}
          leaks = []
          for line in pathlib.Path("deploy/.env").read_text().splitlines():
              name, _, value = line.partition("=")
              if name in names and any(value[i:i + 10] in log for i in range(len(value) - 9)):
                  leaks.append(name)
          print(f"checked {len(log.splitlines())} log lines; leaks: {leaks or 'none'}")
          sys.exit(1 if leaks else 0)
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env down -v

  security:
    name: Security (secrets scan, dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials or secret files in the repository
        run: python3 .github/scripts/security_scan.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Python dependencies have no known vulnerabilities
        working-directory: backend
        run: |
          pip install -q ".[dev,production]" pip-audit
          pip-audit --progress-spinner off --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Production JavaScript dependencies have no known vulnerabilities
        working-directory: frontend
        # Dev-only lint tooling has one documented advisory with no fix (frontend/README.md).
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=low

