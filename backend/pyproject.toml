[project]
name = "peaksift-backend"
version = "0.1.0"
description = "PeakSift AI API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",  # enables pydantic's EmailStr
    "python-multipart>=0.0.20,<1",  # multipart/form-data parsing for uploads
    "celery>=5.4,<6",  # background jobs (transcription)
    "redis>=5,<9",  # Celery broker client
    "faster-whisper>=1.1,<2",  # local speech-to-text (CTranslate2 Whisper)
    "numpy>=1.26,<3",  # PCM arrays handed to faster-whisper (decoded with ffmpeg)
    "openai>=3,<4",  # hosted speech-to-text and clip analysis (official SDK)
    "httpx>=0.28,<1",  # local clip analysis over an Ollama-compatible HTTP endpoint
    "boto3>=1.40,<2",  # S3-compatible private media storage (AWS S3, MinIO, R2)
    "cryptography>=45,<51",  # AES-GCM encryption of stored OAuth refresh tokens
    "google-auth>=2.40,<3",  # Google credentials (official)
    "google-auth-oauthlib>=1.2,<2",  # OAuth authorization-code flow with PKCE (official)
    "google-api-python-client>=2.170,<3",  # YouTube Data API: resumable videos.insert (official)
    "pillow>=12,<14",  # visual assets: content-based image decoding, EXIF orientation, thumbnails
]

[project.optional-dependencies]
# The production API server: gunicorn process management with uvicorn's maintained worker.
production = [
    "gunicorn>=23,<27",
    "uvicorn-worker>=0.3,<1",
]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1",  # required by FastAPI's TestClient
    "ruff>=0.17,<0.18",
    "moto[s3]>=5.1,<6",  # in-process S3 for the storage contract tests
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient prefers its own `httpx2` fork, but FastAPI's documented
    # testing stack is official `httpx`. Silence the resulting deprecation notice.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.isort]
# The local `alembic/` migrations directory shadows the package name.
known-third-party = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
