# Local development services for Milestone 3: PostgreSQL (data) and Redis (job broker).
#
#   docker compose up -d
#
# Creates the `peaksift` (dev) and `peaksift_test` (tests) databases; credentials
# match backend/.env.example. For local development only — not a production setup.

services:
  postgres:
    # PostgreSQL 16 with pgvector (semantic visual search stores vectors). Same Debian base
    # as the plain postgres:16 image, so an existing data volume keeps working.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peaksift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peaksift"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
