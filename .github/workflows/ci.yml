name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (ruff, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peaksift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values for the CI database service; not real credentials.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/peaksift_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/peaksift_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real-0123456789
      # The video pipeline tests generate tiny fixtures with ffmpeg and probe them with
      # ffprobe; in CI a missing binary must fail the tests, not skip them.
      REQUIRE_FFMPEG: "1"
      # Background jobs: Redis service above; the live-broker test must not skip.
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS: "1"
      # Provider tests mock inference. Refuse any accidental Hugging Face download.
      HF_HUB_OFFLINE: "1"
      # No OpenAI key in CI, ever; the OpenAI provider tests use a fake SDK client.
      # Clip detection: no Ollama in CI. Point the endpoint at a closed port with a short
      # connect timeout so an accidental real inference call fails fast instead of hanging;
      # the provider tests use a mocked transport or an in-process fake server.
      OLLAMA_BASE_URL: http://127.0.0.1:9
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (ffprobe for metadata, ffmpeg for generated test fixtures)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -version | head -1
      - name: FFmpeg provides the encoders clip rendering uses (libx264, aac)
        # Clips are rendered with libx264 + aac in production and development; CI must
        # exercise the same encoders rather than silently falling back to another path.
        run: |
          set -euo pipefail
          encoders="$(ffmpeg -hide_banner -encoders)"
          grep -qE '^ V\S* libx264 ' <<<"$encoders" || { echo "libx264 encoder missing"; exit 1; }
          grep -qE '^ A\S* aac ' <<<"$encoders" || { echo "aac encoder missing"; exit 1; }
          echo "libx264 and aac available"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -rs  # -rs lists any skipped tests so a skipped media test is visible
      - name: Real broker + worker smoke (ping round-trip + task registration, no inference)
        run: python scripts/celery_smoke.py
